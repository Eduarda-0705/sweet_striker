<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sweet Striker</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--grass:#2f8f46;--grass2:#3aa356;--deep:#1f6f3a;--blue:#1e5bd8;--sky:#dbe9ff;--white:#fff;--gold:#ffd23f;
--f:'Fredoka','Nunito','Trebuchet MS',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--deep);color:var(--white);font-family:var(--f);display:flex;justify-content:center;
padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{width:100%;max-width:440px;min-height:100%;display:flex;flex-direction:column;padding:14px;gap:12px}
.top{display:flex;justify-content:space-between;align-items:center}
h1{font-size:30px;font-weight:700;margin:0}
.pips{display:flex;gap:7px}
.pip{width:20px;height:20px;border-radius:50%;border:3px solid var(--white)}
.pip.g{background:var(--gold);border-color:var(--gold)}
.pip.x{background:#e85a5a;border-color:#e85a5a}
.screen{display:none;flex:1;flex-direction:column;justify-content:center;gap:16px}
.screen.on{display:flex}
.stage{position:relative;aspect-ratio:360/440;border-radius:18px;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
.zones{position:absolute;left:16.67%;top:13.64%;width:66.67%;height:25%;display:grid;grid-template:1fr 1fr/repeat(3,1fr)}
.zones button{background:transparent;border:0;cursor:pointer;border-radius:8px}
.zones button:active,.zones button:focus-visible{background:rgba(255,255,255,.35);outline:2px solid var(--white)}
.zones.off{pointer-events:none}
.bubble{background:var(--white);color:var(--blue);border-radius:16px;padding:12px 16px;text-align:center;
font-size:20px;font-weight:500;line-height:1.3;min-height:56px;display:flex;align-items:center;justify-content:center}
.card{background:var(--white);color:var(--blue);border-radius:18px;padding:22px;text-align:center;font-size:21px;font-weight:500;line-height:1.4}
.card b{display:block;font-size:30px;margin-bottom:6px}
.big{font-size:96px;font-weight:700;text-align:center;line-height:1;color:var(--gold)}
.btn{font:700 24px var(--f);background:var(--blue);color:var(--white);border:0;border-radius:14px;padding:15px;cursor:pointer;width:100%;box-shadow:0 5px 0 #123c94}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #123c94}
.btn.alt{background:var(--white);color:var(--blue);box-shadow:0 5px 0 #b9cdf0}
.hide{display:none}
#keeper,#ball,#kicker,#leg{transition:transform .5s cubic-bezier(.25,.6,.3,1)}
#leg{transition-duration:.18s}
@media (prefers-reduced-motion:reduce){#keeper,#ball,#kicker,#leg{transition:none}}
</style>
</head>
<body>
<main>
  <div class="top"><h1 id="title"></h1><div class="pips" id="pips"></div></div>

  <section class="screen on" id="s-start">
    <div class="card"><b id="hello"></b><span id="intro"></span></div>
    <button class="btn" id="go">Entrar em campo</button>
  </section>

  <section class="screen" id="s-game">
    <div class="stage">
      <svg viewBox="0 0 360 440" aria-hidden="true">
        <defs><pattern id="st" width="360" height="60" patternUnits="userSpaceOnUse">
          <rect width="360" height="30" fill="#2f8f46"/><rect y="30" width="360" height="30" fill="#3aa356"/></pattern></defs>
        <rect width="360" height="440" fill="url(#st)"/>
        <g fill="none" stroke="#fff" stroke-width="3" opacity=".85">
          <line x1="0" y1="170" x2="360" y2="170"/>
          <rect x="40" y="170" width="280" height="130"/>
          <rect x="110" y="170" width="140" height="48"/>
        </g>
        <circle cx="180" cy="268" r="3.5" fill="#fff"/>
        <!-- gol -->
        <rect x="60" y="60" width="240" height="110" fill="rgba(255,255,255,.12)"/>
        <g stroke="rgba(255,255,255,.35)" stroke-width="1">
          <path d="M60 80H300M60 100H300M60 120H300M60 140H300M60 160H300M90 60V170M120 60V170M150 60V170M180 60V170M210 60V170M240 60V170M270 60V170"/>
        </g>
        <path d="M60 170V60H300V170" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round"/>
        <!-- goleiro -->
        <g id="keeper" style="transform:translate(180px,125px)">
          <rect x="-8" y="2" width="6" height="22" rx="3" fill="#f0c39a"/><rect x="2" y="2" width="6" height="22" rx="3" fill="#f0c39a"/>
          <rect x="-11" y="-14" width="22" height="22" rx="6" fill="#f2c230"/>
          <rect x="-11" y="4" width="22" height="9" fill="#222"/>
          <path d="M-11 -10L-24 -28M11 -10L24 -28" stroke="#f2c230" stroke-width="6" stroke-linecap="round"/>
          <circle cx="-25" cy="-31" r="6" fill="#fff"/><circle cx="25" cy="-31" r="6" fill="#fff"/>
          <circle cx="0" cy="-22" r="8" fill="#f0c39a"/><path d="M-8 -24a8 8 0 0116 0z" fill="#3a2a1a"/>
        </g>
        <!-- bola -->
        <g id="ball" style="transform:translate(180px,268px)">
          <circle r="9" fill="#fff" stroke="#222" stroke-width="1.5"/><circle r="3.5" fill="#222"/>
        </g>
        <!-- jogador de costas -->
        <g id="kicker" style="transform:translate(180px,352px)">
          <rect x="-12" y="0" width="9" height="28" rx="4" fill="#f0c39a"/>
          <rect x="-12" y="20" width="9" height="8" fill="#fff"/><rect x="-13" y="26" width="12" height="6" rx="3" fill="#222"/>
          <g id="leg" style="transform:translate(8px,0) rotate(-35deg)">
            <rect x="-4" y="0" width="9" height="28" rx="4" fill="#f0c39a"/>
            <rect x="-4" y="20" width="9" height="8" fill="#fff"/><rect x="-5" y="26" width="12" height="6" rx="3" fill="#222"/>
          </g>
          <rect x="-15" y="-12" width="30" height="16" rx="4" fill="#fff"/>
          <rect x="-16" y="-44" width="32" height="36" rx="8" fill="#1e5bd8"/>
          <text x="0" y="-18" text-anchor="middle" font-family="Fredoka,Arial" font-weight="700" font-size="20" fill="#fff">33</text>
          <circle cx="0" cy="-55" r="10" fill="#f0c39a"/><path d="M-10 -56a10 10 0 0120 0z" fill="#3a2a1a"/>
        </g>
      </svg>
      <div class="zones" id="zones"></div>
    </div>
    <div class="bubble" id="msg"></div>
  </section>

  <section class="screen" id="s-end">
    <div class="big" id="final"></div>
    <div class="card" id="endtext"></div>
    <div class="card hide" id="prize"><b>Seu prêmio</b><span id="prizetext"></span></div>
    <button class="btn alt" id="show">Ver meu prêmio</button>
    <button class="btn" id="again">Jogar de novo</button>
  </section>
</main>

<script>
/* ====== PERSONALIZE AQUI ====== */
const NOME = "Craque";
const TITULO = "Sweet Striker";
const BEMVINDO = "Convocado: " + NOME;
const INTRO = "Hoje a missão é simples: 5 cobranças e uma goleira bem difícil. Boa sorte, amor!";
const PREMIO = "Vale 1 dia com o time ⚽💙";
const FINAL = {
  0: "Zero gols, mas nesse campo você continua sendo o camisa 10 pra mim.",
  1: "Um golaço! Quero revanche agora.",
  2: "Dois gols! O time tá esquentando.",
  3: "Três gols! Já tem vaga no meu time.",
  4: "Quase perfeito! Mas já é perfeito pra mim.",
  5: "5 de 5! Artilheiro da temporada e campeão do meu coração! 🏆"
};
const FRASES = {
  intro: ["Respira fundo, o estádio inteiro tá olhando.", "Escolhe o canto e manda ver!"],
  goal: ["GOOOOL! A torcida vai à loucura!", "Que pancada! Sem chance pra goleira.", "Golaço! Arrasou, amor."],
  save: ["Defendeu! A goleira tava no caminho.", "Hoje não, craque!", "Que defesa!"],
  out: ["Isso foi pra longe, hahaha!", "Pra fora! A bola foi passear."]
};
/* ================================ */

const $ = id => document.getElementById(id);
const pick = a => a[Math.floor(Math.random() * a.length)];
const X = [100, 180, 260], Y = [92, 145];
let shot, goals, busy;

$('title').textContent = TITULO; $('hello').textContent = BEMVINDO;
$('intro').textContent = INTRO; $('prizetext').textContent = PREMIO;

for (let i = 0; i < 6; i++) {
  const b = document.createElement('button');
  b.setAttribute('aria-label', (i < 3 ? 'Cima ' : 'Baixo ') + ['esquerda', 'meio', 'direita'][i % 3]);
  b.onclick = () => kick(i);
  $('zones').appendChild(b);
}
const tf = (id, v) => $(id).style.transform = v;
function show(id){ document.querySelectorAll('.screen').forEach(s => s.classList.remove('on')); $(id).classList.add('on'); }
function resetPos(){
  ['keeper','ball','kicker','leg'].forEach(i => $(i).style.transition = 'none');
  tf('keeper', 'translate(180px,125px)'); tf('ball', 'translate(180px,268px)');
  tf('kicker', 'translate(180px,352px)'); tf('leg', 'translate(8px,0) rotate(-35deg)');
  void $('ball').getBoundingClientRect();
  ['keeper','ball','kicker','leg'].forEach(i => $(i).style.transition = '');
}
function reset(){
  shot = 0; goals = 0; busy = false;
  $('pips').innerHTML = [0,1,2,3,4].map(i => '<div class="pip" id="p'+i+'"></div>').join('');
  $('msg').textContent = pick(FRASES.intro); $('zones').classList.remove('off');
  $('prize').classList.add('hide'); $('show').classList.remove('hide');
  resetPos(); show('s-game');
}
function kick(z){
  if (busy) return; busy = true; $('zones').classList.add('off');
  const c = z % 3, r = Math.floor(z / 3);
  const kz = Math.floor(Math.random() * 6), kc = kz % 3, kr = Math.floor(kz / 3);
  let res = 'goal';
  if (r === 0 && Math.random() < 0.15) res = 'out';
  else if (kz === z || (kc === c && Math.random() < 0.3)) res = 'save';

  tf('kicker', 'translate(180px,322px)');
  tf('leg', 'translate(8px,0) rotate(50deg)');
  setTimeout(() => {
    const bx = res === 'out' ? X[c] + (c === 1 ? 70 : (c - 1) * 30) : X[c];
    const by = res === 'out' ? 30 : Y[r];
    tf('ball', 'translate(' + bx + 'px,' + by + 'px) rotate(540deg) scale(.7)');
    tf('keeper', 'translate(' + X[kc] + 'px,' + Y[kr] + 'px) rotate(' + (kc - 1) * 65 + 'deg)');
  }, 180);
  setTimeout(() => {
    const p = $('p' + shot);
    p.classList.add(res === 'goal' ? 'g' : 'x');
    if (res === 'goal') goals++;
    $('msg').textContent = pick(FRASES[res]);
    if (navigator.vibrate) navigator.vibrate(res === 'goal' ? [60,40,60] : 120);
    shot++;
    setTimeout(next, 1700);
  }, 800);
}
function next(){
  if (shot >= 5) return end();
  resetPos(); $('msg').textContent = 'Próxima cobrança: ' + (shot + 1) + ' de 5';
  $('zones').classList.remove('off'); busy = false;
}
function end(){
  $('final').textContent = goals + ' / 5';
  $('endtext').textContent = FINAL[goals];
  show('s-end');
}
$('go').onclick = reset; $('again').onclick = reset;
$('show').onclick = () => { $('prize').classList.remove('hide'); $('show').classList.add('hide'); };
</script>
</body>
</html>
